binderhub-service:
  networkPolicy:
    enabled: false
  config:
    BinderHub:
      auth_enabled: false
      use_registry: true
      cors_allow_origin: '*'
      base_url: /services/binder
  extraConfig:
    # extraConfig runs in sorted key order, so this must sort after
    # binderhub-service-01-build-pods-docker-config, which pins push_secret to
    # the Secret the chart renders from plaintext buildPodsRegistryCredentials.
    binderhub-service-01b-push-secret: |
      _push_secret = get_chart_config("config.KubernetesBuildExecutor.push_secret")
      if _push_secret:
          c.KubernetesBuildExecutor.push_secret = _push_secret
jupyterhub:
  hub:
    networkPolicy:
      enabled: false
    image:
      name: ghcr.io/eodcgmbh/fancy_jhub
      tag: latest

    config:
      BinderSpawner:
        auth_enabled: false
        cors_allow_origin: '*'
      JupyterHub:
        redirect_to_server: false 
