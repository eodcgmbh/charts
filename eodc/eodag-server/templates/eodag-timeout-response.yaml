{{- $tr := .Values.timeoutResponse | default dict }}
{{- if and $tr.enabled (.Capabilities.APIVersions.Has "gateway.envoyproxy.io/v1alpha1/BackendTrafficPolicy") }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "common.names.fullname" . }}-timeout-response
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ required "timeoutResponse.routeName is required when timeoutResponse.enabled is true" $tr.routeName }}
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 504
      response:
        contentType: application/json
        body:
          type: Inline
          inline: {{ $tr.body | default "{\"code\": \"GatewayTimeout\", \"description\": \"The request took too long to complete.\"}" | toJson }}
  {{- with $tr.circuitBreaker }}
  circuitBreaker: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
