
{{- if and .Values.timeoutResponse.enabled (.Capabilities.APIVersions.Has "gateway.envoyproxy.io/v1alpha1/BackendTrafficPolicy") }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-timeout-response
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eodag-server.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.timeoutResponse.routeName }}
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 504
      response:
        contentType: application/json
        body:
          type: Inline
          inline: {{ .Values.timeoutResponse.body | toJson }}
  circuitBreaker:
    maxParallelRequests: 40
    maxPendingRequests: 20
{{- end }}
