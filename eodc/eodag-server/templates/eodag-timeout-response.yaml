{{- if and .Values.timeoutResponse.enabled (.Capabilities.APIVersions.Has "gateway.envoyproxy.io/v1alpha1/BackendTrafficPolicy") }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "common.names.fullname" . }}-timeout-response
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.timeoutResponse.routeName }}
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 504
      response:
        contentType: application/json
        body:
          type: Inline
          inline: {{ .Values.timeoutResponse.body | toJson }}
  circuitBreaker:
    maxParallelRequests: 40
    maxPendingRequests: 20
{{- end }}
