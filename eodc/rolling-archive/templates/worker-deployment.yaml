{{- range $account := .Values.worker.priority.accounts }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rolling-archive.workerDeploymentName" (dict "context" $ "tier" "priority" "account" $account) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-priority
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rolling-archive.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker-priority
      rolling-archive/account: {{ $account.name }}
  template:
    metadata:
      labels:
        {{- include "rolling-archive.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker-priority
        rolling-archive/account: {{ $account.name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.worker.repository }}:{{ $.Values.image.worker.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ $.Values.kafka.bootstrap | quote }}
            - name: KAFKA_TOPIC
              value: {{ $.Values.worker.priority.topic | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ printf "%s-worker-priority" (include "rolling-archive.fullname" $) | quote }}
            - name: KAFKA_PRODUCT_UPLOADED_TOPIC
              value: {{ $.Values.kafka.topics.productUploaded | quote }}
            - name: CONCURRENCY
              value: {{ $.Values.worker.concurrency | quote }}
            - name: PROVIDER_ID
              value: {{ $.Values.s3.providerId | quote }}
            - name: S3_HOST
              value: {{ $.Values.s3.host | quote }}
            - name: S3_BUCKET
              value: {{ $.Values.s3.bucket | quote }}
            - name: S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.s3.existingSecret }}
                  key: S3_KEY
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.s3.existingSecret }}
                  key: S3_SECRET
            - name: CDSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $account.existingSecret }}
                  key: CDSE_USERNAME
            - name: CDSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $account.existingSecret }}
                  key: CDSE_PASSWORD
            - name: MIRROR_ASSETS
              value: {{ $.Values.worker.mirrorAssets | quote }}
            - name: ASSET_MIRROR_STRATEGY
              value: {{ $.Values.worker.assetMirrorStrategy | quote }}
            {{- if and $.Values.worker.mirrorAssets (eq $.Values.worker.assetMirrorStrategy "cdse_s3") }}
            - name: CDSE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.worker.cdseS3.existingSecret }}
                  key: CDSE_S3_ACCESS_KEY
            - name: CDSE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.worker.cdseS3.existingSecret }}
                  key: CDSE_S3_SECRET_KEY
            {{- end }}
          {{- with $.Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}

