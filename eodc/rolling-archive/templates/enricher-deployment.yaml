apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rolling-archive.fullname" . }}-enricher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
    app.kubernetes.io/component: enricher
spec:
  replicas: {{ .Values.enricher.replicas }}
  selector:
    matchLabels:
      {{- include "rolling-archive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: enricher
  template:
    metadata:
      labels:
        {{- include "rolling-archive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: enricher
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: enricher
          image: "{{ .Values.image.registry }}/{{ .Values.image.enricher.repository }}:{{ .Values.image.enricher.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topics.productUploaded | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ printf "%s-enricher" (include "rolling-archive.fullname" .) | quote }}
            - name: KAFKA_PRODUCT_AVAILABLE_TOPIC
              value: {{ .Values.kafka.topics.productAvailable | quote }}
            - name: STAC_API_BASE_URL
              value: {{ required "enricher.stacApiBaseUrl is required" .Values.enricher.stacApiBaseUrl | quote }}
            - name: POLL_BATCH_SIZE
              value: {{ .Values.enricher.pollBatchSize | int | quote }}
          {{- with .Values.enricher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
