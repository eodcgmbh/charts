{{- if eq .Values.ingestion.mode "push" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rolling-archive.fullname" . }}-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rolling-archive.fullname" . }}-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rolling-archive.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "rolling-archive.fullname" . }}-sensor
  apiGroup: rbac.authorization.k8s.io
{{- end }}
