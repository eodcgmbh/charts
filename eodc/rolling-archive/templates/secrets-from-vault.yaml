{{- if .Values.vault.enabled }}
{{/*
Confirmed live convention at EODC (see cluster-mgmt/charts/resource-controllers'
own secret.yaml for the precedent this mirrors): commit a plain Secret whose
values are literal `vault:<mount>/data/<path>#<field>` placeholder strings, not
real credentials -- bank-vaults' vault-secrets-webhook (already installed
cluster-wide) resolves them into real values at pod admission time, for any pod
carrying the vault.security.banzaicloud.io/* annotations set in
poller-deployment.yaml. Nothing here is a real secret value.

Path layout: <vault.mount>/data/<vault.basePath>/<slug>#<field>, where <slug> is
each existingSecret name with its "-credentials" suffix trimmed (s3, airflow,
cdse-account1 .. cdse-account5) -- one deterministic mapping, not one per secret,
matching this project's "one function decides X" convention elsewhere
(rolling_archive_worker.buckets.bucket_for()). See _helpers.tpl for the
"rolling-archive.vaultRef" template this file uses to build each placeholder.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_HOST: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "host") | trim | quote }}
  S3_KEY: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "key") | trim | quote }}
  S3_SECRET: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "secret") | trim | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.poller.airflow.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIRFLOW_USERNAME: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "airflow" "field" "username") | trim | quote }}
  AIRFLOW_PASSWORD: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "airflow" "field" "password") | trim | quote }}
{{- $seen := dict }}
{{- range $entry := .Values.poller.entries }}
{{- if not (hasKey $seen $entry.existingSecret) }}
{{- $_ := set $seen $entry.existingSecret true }}
{{- $slug := trimSuffix "-credentials" $entry.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $entry.existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "username") | trim | quote }}
  password: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "password") | trim | quote }}
  # Only meaningful for CDSE accounts with TOTP/2FA enabled -- harmless if the
  # Vault path has no `totp_secret` field, the webhook leaves an unresolved
  # placeholder in that case (poller-deployment.yaml reads this key as
  # `optional: true` regardless).
  totp_secret: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "totp_secret") | trim | quote }}
{{- end }}
{{- end }}
{{- end }}
