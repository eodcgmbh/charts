{{- if .Values.vault.enabled }}
{{/*
EODC-wide convention (see cluster-mgmt/charts/resource-controllers' own
secret.yaml for the precedent this mirrors): commit a plain Secret whose values
are literal `vault:<mount>/data/<path>#<field>` placeholder strings, not real
credentials -- bank-vaults' vault-secrets-webhook (installed cluster-wide)
resolves them into real values at pod admission time, for any pod carrying the
vault.security.banzaicloud.io/* annotations set in poller-deployment.yaml.
Nothing here is a real secret value.

Path layout: <vault.mount>/data/<vault.basePath>/<slug>#<field>. For s3 and the
CDSE account secrets, <slug> is each existingSecret name with its
"-credentials" suffix trimmed -- deliberately SHARED across every environment
pointing at this same Vault mount/basePath (e.g. dev-smoke-test and production
read the same "s3" entry on purpose, see the chart README). The airflow
secret is the one exception: dev and prod are genuinely different Airflow
instances, so its slug is the explicit poller.airflow.vaultSecretSlug value
instead, not derived from anything -- deliberately NOT vault.role, since that's
a short Kubernetes-auth role name (e.g. "prod"), not the longer environment
slug Vault's own airflow secrets happen to be named with (e.g.
"airflow-production"). See _helpers.tpl for the "rolling-archive.vaultRef"
template this file uses to build each placeholder.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_HOST: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "host") | trim | quote }}
  S3_KEY: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "key") | trim | quote }}
  S3_SECRET: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" "s3" "field" "secret") | trim | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.poller.airflow.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIRFLOW_BASE_URL: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" .Values.poller.airflow.vaultSecretSlug "field" "url") | trim | quote }}
  AIRFLOW_USERNAME: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" .Values.poller.airflow.vaultSecretSlug "field" "username") | trim | quote }}
  AIRFLOW_PASSWORD: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" .Values.poller.airflow.vaultSecretSlug "field" "password") | trim | quote }}
{{- $seen := dict }}
{{- range $entry := .Values.poller.entries }}
{{- if not (hasKey $seen $entry.existingSecret) }}
{{- $_ := set $seen $entry.existingSecret true }}
{{- $slug := trimSuffix "-credentials" $entry.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $entry.existingSecret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "rolling-archive.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "username") | trim | quote }}
  password: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "password") | trim | quote }}
  # Only meaningful for CDSE accounts with TOTP/2FA enabled -- harmless if the
  # Vault path has no `totp_secret` field, the webhook leaves an unresolved
  # placeholder in that case (poller-deployment.yaml reads this key as
  # `optional: true` regardless).
  totp_secret: {{ include "rolling-archive.vaultRef" (dict "context" $ "slug" $slug "field" "totp_secret") | trim | quote }}
{{- end }}
{{- end }}
{{- end }}
